---
layout: default
---

<article class="card">
    {% if page.image %}
    <img class="card-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% endif %}
    <div class="card-content">
        {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
        <h1 style="color:#ffffff; font-size:26px; margin:15px 0 5px 0;">{{ page.title }}</h1>
        <p style="color:#64748b; font-size:12px; margin-bottom:20px;">{{ page.date | date: "%d de %B de %Y" }}</p>

        {{ content }}
    </div>
</article>
